name: Drug Safety Intelligence - CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Linting Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Installing requirements from both microservices to avoid missing import warnings
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        if [ -f frontend/requirements.txt ]; then pip install -r frontend/requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all other issues as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Run Docker Containers
      run: docker-compose up --build -d

    - name: Wait for Services to Start
      run: sleep 15

    - name: Test Backend API Health
      run: curl -f http://localhost:8000/ || exit 1

    - name: Test Frontend Health
      run: curl -f http://localhost:8501/ || exit 1

    - name: Tear Down Containers
      if: always()
      run: docker-compose down